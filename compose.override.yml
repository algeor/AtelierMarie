# Local-only: the r2-integration compose.yml runs the backend on 8001, but the
# Dockerfile default (and the desired local setup) is 8000. This override pins the
# backend command, healthcheck, and published port to 8000, and points the SSR
# container-to-container URL and the frontend build-time NEXT_PUBLIC_* args at 8000.
# Not committed; delete when done.
services:
  backend:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    ports: !override
      - "127.0.0.1:8000:8000"
  frontend:
    build:
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_MEDIA_URL: http://localhost:8000/static
    environment:
      API_INTERNAL_URL: http://backend:8000
