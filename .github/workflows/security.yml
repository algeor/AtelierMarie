name: Security Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install detect-secrets
        run: python -m pip install --quiet detect-secrets==1.5.0

      - name: Run detect-secrets baseline check
        run: git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline

  python-dependency-audit:
    name: Python Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Backend
        run: make setup-backend

      - name: Install pip-audit
        run: .venv/bin/pip install --quiet pip-audit==2.9.0

      - name: Audit Python environment
        run: .venv/bin/pip-audit

  frontend-dependency-audit:
    name: Frontend Production Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install frontend dependencies
        run: npm --prefix frontend ci --silent

      - name: Audit frontend production dependencies
        run: npm --prefix frontend audit --omit=dev --audit-level=high
