name: Frontend Lint Analysis

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-frontend:
    name: Frontend Lint Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Setup Frontend
        run: make setup-frontend

      - name: Run frontend linting
        run: make lint-frontend
      