name: Backend Unit Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-backend:
    name: Backend Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Backend
        run: make setup-backend

      - name: Run backend unit tests
        run: make test-backend
      