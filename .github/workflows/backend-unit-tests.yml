name: Backend Tests

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'app/**'
      - 'tests/**'
      - 'Makefile'
      - 'pyproject.toml'
      - '.github/workflows/backend-unit-tests.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Backend Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Backend
        run: make setup-backend

      - name: Run backend unit tests (with coverage gate)
        run: .venv/bin/pytest tests/ -m "not integration" --cov=app --cov-report=term-missing

  integration:
    name: Backend Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Backend
        run: make setup-backend

      - name: Run backend integration tests
        run: make test-integration
