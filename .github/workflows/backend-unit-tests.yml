name: Backend Tests

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'app/**'
      - 'tests/**'
      - 'alembic/**'
      - 'conftest.py'
      - 'Makefile'
      - 'pyproject.toml'
      - '.github/workflows/backend-unit-tests.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Backend Unit Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: atelier_marie
          POSTGRES_USER: atelier
          POSTGRES_PASSWORD: atelier
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atelier -d atelier_marie"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://atelier:atelier@localhost:5432/atelier_marie

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Backend
        run: make setup-backend

      - name: Run backend unit tests (with coverage gate)
        run: .venv/bin/pytest tests/ -m "not integration" --cov=app --cov-report=term-missing

  integration:
    name: Backend Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: atelier_marie
          POSTGRES_USER: atelier
          POSTGRES_PASSWORD: atelier
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atelier -d atelier_marie"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://atelier:atelier@localhost:5432/atelier_marie

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Backend
        run: make setup-backend

      - name: Run backend integration tests
        run: make test-integration
