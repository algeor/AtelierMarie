name: Frontend Unit Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-frontend:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Setup Frontend
        run: make setup-frontend

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify testids.py is in sync with testids.ts
        run: |
          python scripts/generate_testids.py
          git diff --exit-code tests/e2e/testids.py

      - name: Run frontend unit tests
        run: make test-frontend
      