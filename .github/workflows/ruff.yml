name: Backend Ruff Lint Analysis

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'app/**'
      - 'tests/**'
      - 'Makefile'
      - 'pyproject.toml'
      - '.github/workflows/ruff.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-backend:
    name: Backend Ruff Lint Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Backend
        run: make setup-backend

      - name: Run backend Ruff linting
        run: make lint-backend
