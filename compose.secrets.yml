# Production secret-file overlay.
#
# Use with:
#   docker compose --env-file .env.docker -f compose.yml -f compose.secrets.yml up -d --build
#
# The base compose.yml remains convenient for local development. This overlay
# keeps production database credentials out of .env.docker by mounting them as
# Docker secrets and pointing the app at *_FILE settings.
services:
  postgres:
    environment:
      POSTGRES_PASSWORD: null
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    ports: !reset []

  migrate:
    environment:
      DATABASE_URL: null
      DATABASE_URL_FILE: /run/secrets/database_url
      JWT_SECRET: null
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      ADMIN_API_KEY: null
      ADMIN_API_KEY_FILE: /run/secrets/admin_api_key
      MIGRATION_DATABASE_URL_FILE: /run/secrets/migration_database_url
    secrets:
      - database_url
      - migration_database_url
      - jwt_secret
      - admin_api_key

  backend:
    environment:
      DATABASE_URL: null
      DATABASE_URL_FILE: /run/secrets/database_url
      JWT_SECRET: null
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      ADMIN_API_KEY: null
      ADMIN_API_KEY_FILE: /run/secrets/admin_api_key
    secrets:
      - database_url
      - jwt_secret
      - admin_api_key

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  database_url:
    file: ./secrets/database_url
  migration_database_url:
    file: ./secrets/migration_database_url
  jwt_secret:
    file: ./secrets/jwt_secret
  admin_api_key:
    file: ./secrets/admin_api_key
