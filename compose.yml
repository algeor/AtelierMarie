services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: atelier_marie
      POSTGRES_USER: atelier
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atelier}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U atelier -d atelier_marie" ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - atelier_postgres:/var/lib/postgresql/data
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: atelier-marie-backend:latest
    restart: "no"
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql://atelier:${POSTGRES_PASSWORD:-atelier}@postgres:5432/atelier_marie}
    depends_on:
      postgres:
        condition: service_healthy
    command: [ "alembic", "upgrade", "head" ]
  backend:
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: atelier-marie-backend:latest
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql://atelier:${POSTGRES_PASSWORD:-atelier}@postgres:5432/atelier_marie}
      STATIC_FILE_PATH: /data/static
      VIDEO_UPLOAD_TEMP_PATH: /data/video-temp
      ANALYTICS_DATA_DIR: /data/analytics
      ANALYTICS_EVENTS_JSONL_PATH: /data/analytics/events.jsonl
      ANALYTICS_DUCKDB_PATH: /data/analytics/analytics.duckdb
      FFMPEG_PATH: ffmpeg
      FFPROBE_PATH: ffprobe
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8001}:8001"
    volumes:
      - atelier_static:/data/static
      - atelier_video_temp:/data/video-temp
      - atelier_analytics:/data/analytics

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${BACKEND_HOST_PORT:-8001}}
        NEXT_PUBLIC_MEDIA_URL: ${NEXT_PUBLIC_MEDIA_URL:-http://localhost:${BACKEND_HOST_PORT:-8001}/static}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:${FRONTEND_HOST_PORT:-3000}}
        NEXT_PUBLIC_USE_MOCK_API: ${NEXT_PUBLIC_USE_MOCK_API:-false}
        NEXT_PUBLIC_STRIPE_ENABLED: ${NEXT_PUBLIC_STRIPE_ENABLED:-false}
        NEXT_PUBLIC_BANK_IBAN: ${NEXT_PUBLIC_BANK_IBAN:-}
        NEXT_PUBLIC_BANK_BIC: ${NEXT_PUBLIC_BANK_BIC:-}
        NEXT_PUBLIC_BANK_NAME: ${NEXT_PUBLIC_BANK_NAME:-}
        NEXT_PUBLIC_INSTAGRAM_URL: ${NEXT_PUBLIC_INSTAGRAM_URL:-}
        NEXT_PUBLIC_TIKTOK_URL: ${NEXT_PUBLIC_TIKTOK_URL:-}
        NEXT_PUBLIC_ANALYTICS_CONSENT_VERSION: ${NEXT_PUBLIC_ANALYTICS_CONSENT_VERSION:-2026-07-31}
    image: atelier-marie-frontend:latest
    restart: unless-stopped
    environment:
      # Server-only URL used by Next.js Server Components to reach the backend
      # over the internal Docker network. Not a NEXT_PUBLIC_ var — never shipped
      # to the browser. The browser uses NEXT_PUBLIC_API_URL (baked at build).
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://backend:8001}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3000}:3000"

volumes:
  atelier_postgres:
  atelier_static:
  atelier_video_temp:
  atelier_analytics:
