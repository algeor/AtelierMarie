# Atelier Marie — Nginx Rate Limiting Configuration
#
# Include this file at the http { } context of your main nginx.conf (or as a
# /etc/nginx/conf.d/*.conf drop-in, which Nginx automatically includes in http):
#
#   include /etc/nginx/conf.d/ratelimit.conf;
#
# The `limit_req_zone` and `map` directives below MUST live at http context.
# The `limit_req` / `error_page` / `location` directives at the bottom are an
# example server block — copy them into your own server { } and adapt paths.
#
# Rates are per-minute (r/m) to match the spec in
# openspec/changes/admin-polish-edge-cases/specs/rate-limiting/spec.md.

# ---------------------------------------------------------------------------
# Session-cookie fallback map
# ---------------------------------------------------------------------------
# Checkout is rate-limited by the session cookie set by the backend
# (session_id — see app/config.py:session_cookie_name). If the cookie is
# absent (cookieless / first-time clients), fall back to the client IP so a
# single anonymous bucket cannot exhaust everyone else's slots.
#
# The IP backstop zone below (`checkout_ip_backstop`) is still MANDATORY:
# session-only limiting is trivially bypassed by rotating/omitting cookies.
map $cookie_session_id $checkout_rate_key {
    ""      $binary_remote_addr;
    default $cookie_session_id;
}

# ---------------------------------------------------------------------------
# Rate Limit Zones (http context)
# ---------------------------------------------------------------------------

# Zone: auth — /v1/auth/* endpoints (login, OAuth callback, logout).
# Strict per-IP limit: 5 requests per minute. Protects against credential
# stuffing and OAuth-callback abuse.
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

# Zone: checkout — POST /v1/orders keyed by session cookie (with IP fallback
# for cookieless clients via the map above). 10 requests per minute per
# session. Prevents automated checkout abuse while allowing legitimate retries.
limit_req_zone $checkout_rate_key zone=checkout:10m rate=10r/m;

# Zone: checkout_ip_backstop — MANDATORY IP backstop for POST /v1/orders.
# Catches clients that rotate or omit session cookies to evade the
# session-keyed checkout zone. 30 requests per minute per IP.
limit_req_zone $binary_remote_addr zone=checkout_ip_backstop:10m rate=30r/m;

# Zone: admin — /v1/admin/* endpoints. 30 requests per minute per IP.
# Protects against compromised API keys being used for automated abuse
# while remaining generous for legitimate admin workflows.
limit_req_zone $binary_remote_addr zone=admin:10m rate=30r/m;

# Return 429 (Too Many Requests) on rate-limit rejection so the error_page
# handler below can substitute the JSON envelope.
limit_req_status 429;

# Suppress Nginx version/tokens from error responses.
server_tokens off;

